<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta author="Toufik Jamal" />
    <meta name="description" content="game,rock,Paper,Scissors,web-game" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="title"><h1>Rock Paper Scissors</h1></div>
      <div class="computer">
        <h2>Computer</h2>
        <div id="comScore">0</div>
      </div>
      <div class="player">
        <h2>Player</h2>
        <div id="playScore">0</div>
      </div>
    </header>
    <main>
        <div id="comSelect">
          <p>Computer Select</p>
        </div>
        <div>
            <h2 id="win"></h2>
            <button id="playAgain">Play Again</button>
            <button id="reset">Reset Score</button>
        </div>
        <div id="playSelect">
          <p>Player Select</p>
        </div>
    </main>
    <footer>
        <button id="rock">Rock</button><button id="paper">Paper</button><button id="scissor">Scissor</button>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
